/dual_arm_teleop:
  ros__parameters:
    # Safety gates, not claims about Piper physical limits. Calibrate on hardware.
    publish_hz: 100.0
    stale_timeout_sec: 0.2
    max_joint_abs_rad: 3.0
    max_gripper_abs_m: 0.08
    # Explicit arm holds feedback once, then sends the live master pose.
    # These gates bound the automatic joint-space alignment path.
    max_alignment_joint_error_rad: 1.0
    # Full official 80 mm opening mismatch is allowed to align.
    max_alignment_gripper_error_m: 0.08
    alignment_joint_tolerance_rad: 0.02
    alignment_gripper_tolerance_m: 0.002
    alignment_timeout_sec: 15.0
    alignment_settle_sec: 0.3
    max_alignment_master_joint_drift_rad: 0.05
    max_alignment_master_gripper_drift_m: 0.005
    max_joint_step_rad: 0.1
    max_gripper_step_m: 0.01
    alignment_speed_percent: 100.0
    speed_percent: 100.0
    # This is torque, not a gripper speed percentage.
    gripper_effort: 1.0
    topics.master_left: /master_left/joint_states
    topics.master_right: /master_right/joint_states
    topics.follower_left: /follower_left/joint_states_feedback
    topics.follower_right: /follower_right/joint_states_feedback
    topics.command_left: /follower_left/joint_ctrl_cmd
    topics.command_right: /follower_right/joint_ctrl_cmd

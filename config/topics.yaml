piper_aio_collect:
  ros__parameters:
    dataset_dir: "~/data/piper_aio_ros2"
    task_name: "test"
    episode_index: 0
    frame_rate: 30.0
    use_depth: false
    camera_names: ["cam_high", "cam_left_wrist", "cam_right_wrist"]

    topics.rgb_front: "/camera_f/color/image_raw"
    topics.rgb_left: "/camera_l/color/image_raw"
    topics.rgb_right: "/camera_r/color/image_raw"
    topics.depth_front: "/camera_f/depth/image_raw"
    topics.depth_left: "/camera_l/depth/image_raw"
    topics.depth_right: "/camera_r/depth/image_raw"

    # Defaults exposed by piper_ros2 start_two_piper.launch.py.
    # Replace action topics with real leader JointState topics when present.
    topics.follower_joint_left: "/joint_left"
    topics.follower_joint_right: "/joint_right"
    topics.leader_action_left: "/joint_states_ctrl_left"
    topics.leader_action_right: "/joint_states_ctrl_right"
    topics.follower_eef_left: "/end_pose_stamped_left"
    topics.follower_eef_right: "/end_pose_stamped_right"

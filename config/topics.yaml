piper_aio_collect:
  ros__parameters:
    dataset_dir: "~/data/piper_aio_ros2"
    task_name: "test"
    episode_index: 0
    frame_rate: 30.0
    use_depth: false
    camera_names: ["cam_high", "cam_left_wrist", "cam_right_wrist"]

    topics.rgb_front: "/camera_f/color/image_raw"
    topics.rgb_left: "/camera_l/color/image_raw"
    topics.rgb_right: "/camera_r/color/image_raw"
    topics.depth_front: "/camera_f/depth/image_raw"
    topics.depth_left: "/camera_l/depth/image_raw"
    topics.depth_right: "/camera_r/depth/image_raw"

    # Namespaced feedback exposed by four_arm.launch.py. No teleop bridge is
    # implied: leader measurements are collected as actions only.
    topics.follower_joint_left: "/follower_left/joint_states_feedback"
    topics.follower_joint_right: "/follower_right/joint_states_feedback"
    topics.leader_action_left: "/master_left/joint_states"
    topics.leader_action_right: "/master_right/joint_states"
    topics.follower_eef_left: "/follower_left/end_pose_stamped"
    topics.follower_eef_right: "/follower_right/end_pose_stamped"
